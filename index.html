.bottom{margin-top:80px;display:flex;justify-content:center;gap:10px}
.bottom span{background:#0a1a33;padding:10px 15px;border-radius:20px;font-size:14px}

</head>
<body>
<div class="top"><span>ADIL CINEMA</span><span>★ Test</span><span>EXP : 08/11/2026</span></div>
