<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADIL CINEMA - Portal</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a2e;color:white;min-height:100vh}
.top{padding:15px 20px;color:#00e5ff;font-weight:bold;font-size:20px}
.box{max-width:420px;margin:60px auto;background:#2a1a8a;padding:30px;border-radius:15px;text-align:center;box-shadow:0 0 40px #00e5ff55}
input{width:100%;padding:13px;margin:8px 0 15px 0;border-radius:8px;border:none;background:#0a0a2e;color:white;font-size:16px;box-sizing:border-box;outline:none}
input:focus{outline:2px solid #00e5ff}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#00e5ff;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
#msg{margin-top:15px;min-height:20px;font-size:14px;color:#ffdd00}
</style>
</head>
<body>
<div class="top">ADIL CINEMA</div>
<div class="box">
<h2>Connectez Votre Appareil</h2>
<p>Entrez MAC et Clé pour gérer vos playlists</p>
<label style="float:left;font-size:13px">Adresse MAC de l'Appareil</label>
<input id="mac" placeholder="00:00:00:00:00:00" maxlength="17" autocomplete="off">
<label style="float:left;font-size:13px">Clé de l'Appareil</label>
<input id="cle" type="password" placeholder="••••••">
<button onclick="login()">Se Connecter & Gérer les Playlists</button>
<div id="msg"></div>
</div>
<script>
// كيدير النقط بوحدو و كيحيد الحروف الغالطة
document.getElementById('mac').addEventListener('input', function(e){
  let v = e.target.value.toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,12);
  let out = [];
  for(let i=0;i<v.length;i+=2){ out.push(v.substr(i,2)); }
  e.target.value = out.join(':');
});
function login(){
  let mac = document.getElementById('mac').value;
  let cle = document.getElementById('cle').value;
  let msg = document.getElementById('msg');
  if(mac.length < 17){
    msg.textContent = "⚠️ كتب MAC كامل: 12 حرف، مثلا AA:BB:CC:DD:EE:FF";
    return;
  }
  if(cle.length < 3){
    msg.textContent = "⚠️ كتب Clé - على الأقل 3 حروف";
    return;
  }
  msg.style.color = "#00ff88";
  msg.textContent = "✅ Dkhelti! MAC: " + mac;
  localStorage.setItem('adil_mac', mac);
  localStorage.setItem('adil_cle', cle);
  // من بعد 1 ثانية، سير للصفحة ديال playlists
  setTimeout(()=>{ window.location.href = "index.html?mac=" + encodeURIComponent(mac); }, 1000);
}
</script>
</body>
</html>
