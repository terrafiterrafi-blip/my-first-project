<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADIL CINEMA - Portail</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0a0a5c;color:white;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px}
.logo{font-size:22px;font-weight:900;color:#00e5ff}
.badge{background:#7b2ff7;padding:8px 14px;border-radius:20px;font-size:13px}
.card{background:#1a1ac2;max-width:480px;margin:30px auto;padding:25px;border-radius:20px;text-align:center}
h1{font-size:24px;margin:0}
p{opacity:.8;font-size:14px}
label{display:block;text-align:left;margin:18px 0 6px;font-size:14px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #5555ff;background:#0a0a8a;color:white;font-size:17px;letter-spacing:1px;outline:none;text-transform:uppercase}
input:focus{border-color:#00e5ff}
button{width:100%;padding:15px;border:none;border-radius:10px;background:#00e5ff;color:#001; font-weight:800;font-size:16px;margin-top:20px;cursor:pointer}
button:active{transform:scale(.98)}
.small{font-size:12px;margin-top:10px;opacity:.7}
#dashboard{display:none;max-width:600px;margin:20px auto;padding:20px}
.playlist{background:#1a1ac2;padding:15px;border-radius:15px;margin-top:15px}
.row{display:flex;justify-content:space-between;align-items:center;background:#0a0a8a;padding:12px;border-radius:10px;margin:8px 0}
.row button{width:auto;padding:8px 12px;margin:0;background:#ff4444;color:white;font-size:12px}
.add{display:flex;gap:8px;margin-top:15px}
.add input{flex:1}
.add button{width:auto;margin:0;padding:12px 18px}
.error{color:#ff9a9a;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<header><div class="logo">ADIL CINEMA</div><div class="badge">Portail Playlist Utilisateur</div></header>

<div class="card" id="loginBox">
<h1>Connectez Votre Appareil</h1>
<p>Entrez MAC et Clé pour gérer vos playlists</p>
<label>Adresse MAC de l'Appareil</label>
<input id="mac" placeholder="A4:C3:C8:87:92:29" maxlength="17" autocomplete="off">
<label>Clé de l'Appareil</label>
<input id="key" placeholder="535482" inputmode="numeric">
<button onclick="login()">Se Connecter & Gérer les Playlists</button>
<div class="error" id="err">MAC ou Clé incorrect, 3awd jereb</div>
<div class="small">Astuce pour test: هادو يبقاو لي MAC و Clé ديالك</div>
</div>

<div id="dashboard">
<h2 style="text-align:center">Bienvenue 👋</h2>
<p style="text-align:center" id="infoMac"></p>
<div class="playlist">
<h3>📺 Playlist dyalek</h3>
<div id="list"></div>
<div class="add">
<input id="newChan" placeholder="Smiya dyal chaine, ex: beIN Sports">
<button onclick="addChan()">+ Zid</button>
</div>
<button onclick="logout()" style="background:#444;color:white">Déconnexion</button>
</div>
</div>

<script>
// 1. MAC AUTOMATIQUE - kaydir : bouhdo
const macInput = document.getElementById('mac');
macInput.addEventListener('input', function(){
  let v = this.value.toUpperCase().replace(/[^A-F0-9]/g,'').slice(0,12);
  let parts = [];
  for(let i=0;i<v.length;i+=2){ parts.push(v.slice(i,i+2)); }
  this.value = parts.join(':');
});

// 2. Clé ghir ar9am
document.getElementById('key').addEventListener('input', function(){
  this.value = this.value.replace(/[^0-9]/g,'').slice(0,8);
});

let channels = ["beIN Sports 1","MBC 2","2M","Arryadia","Netflix - Films"];

function render(){
  document.getElementById('list').innerHTML = channels.map((c,i)=>`
    <div class="row"><span>${c}</span><button onclick="delChan(${i})">Supprimer</button></div>
  `).join('');
}
function login(){
  let mac = macInput.value.trim();
  let key = document.getElementById('key').value.trim();
  if(mac.length !== 17 || key.length < 4){
    document.getElementById('err').style.display='block';
    return;
  }
  document.getElementById('err').style.display='none';
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('infoMac').innerText = "MAC: " + mac + " | Clé: " + key;
  render();
}
function addChan(){
  let v = document.getElementById('newChan').value.trim();
  if(!v) return;
  channels.push(v);
  document.getElementById('newChan').value='';
  render();
}
function delChan(i){ channels.splice(i,1); render(); }
function logout(){
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginBox').style.display='block';
}
</script>
</body>
</html>
