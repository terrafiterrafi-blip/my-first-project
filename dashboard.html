<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW PLAYER - Dashboard</title>
<style>
body{margin:0;background:#05081f;color:white;font-family:Arial}
.top{padding:15px 20px;display:flex;justify-content:space-between;font-weight:bold}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}
.card{background:#0d1330;padding:20px;border-radius:15px}
label{display:block;margin:12px 0 5px;font-size:13px;color:#ccc}
input{width:100%;padding:12px;border-radius:8px;border:none;background:#05081f;color:white;box-sizing:border-box}
.tabs{display:flex;gap:10px}.tabs button{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;background:#1a2150;color:white}
.tabs button.active{background:#00cfff}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#00cfff;color:white;font-weight:bold;margin-top:15px;cursor:pointer}
.badge{background:#ffcc00;color:black;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.row{display:flex;gap:10px}.row>div{flex:1}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<div class="top"><span>SW PLAYER</span><span>Portal Playlist Utilisateur</span></div>
<div class="grid">
<div class="card">
<h3>Aperçu de l'Appareil</h3>
<p style="color:#aaa;font-size:13px" id="macTxt"></p>
<label>Date d'Expiration</label><input value="14/11/2026" readonly>
<label>Type de Compte</label><input value="Essai Gratuit 7 Jours (Accès)" readonly>
<label>ID De Déverrouillage</label><input value="536462" readonly>
<p style="margin-top:15px"><span class="badge">TRIAL</span> <span style="color:#aaa">Mes Playlists Actives</span></p>
<div id="liste"></div>
</div>
<div class="card">
<h3>Ajouter une Playlist</h3>
<p style="color:#aaa;font-size:13px">Diffusez des chaînes en direct, films et séries directement sur votre lecteur.</p>
<div class="tabs"><button id="bM3U" class="active" onclick="switchTab('m3u')">Lien M3U</button><button id="bXt" onclick="switchTab('xt')">⚡ Codes Xtream</button></div>
<div id="formM3U">
<label>Nom de la Playlist</label><input id="nom" placeholder="ex: Ma Ligne VIP">
<label>Lien M3U/Plus</label><input id="lien" placeholder="http://serveur.com/get.php?username=...&password=...&type=m3u_plus">
</div>
<div id="formXt" style="display:none">
<label>Nom de la Playlist</label><input id="nom2" placeholder="ex: Ma Ligne VIP">
<label>URL / Serveur Host</label><input id="host" placeholder="http://serveur-iptv.com:8080">
<div class="row"><div><label>Nom d'Utilisateur</label><input id="user" placeholder="Nom d'utilisateur"></div><div><label>Mot de Passe</label><input id="pass" placeholder="Mot de passe"></div></div>
</div>
<label>🔒 Code PIN de Protection (Optionnel - 4 chiffres)</label><input id="pin" placeholder="Entrez 4 chiffres pour verrouiller la liste" maxlength="4">
<p style="font-size:12px;color:#888">Lorsque votre liste est protégée par un code PIN, la lecture ne sera pas possible sans le code.</p>
<button class="btn" onclick="ajouter()">Enregistrer & Synchroniser sur la TV</button>
</div>
</div>
<script>
let mac=new URLSearchParams(location.search).get('mac')||localStorage.getItem('sw_mac')||'AA:C3:CB:87:92:29';
document.getElementById('macTxt').textContent='Appareil: '+mac;
let type='m3u';
function switchTab(t){type=t;document.getElementById('bM3U').classList.toggle('active',t=='m3u');document.getElementById('bXt').classList.toggle('active',t=='xt');document.getElementById('formM3U').style.display=t=='m3u'?'block':'none';document.getElementById('formXt').style.display=t=='xt'?'block':'none';}
let lists=JSON.parse(localStorage.getItem('lists_'+mac)||'[]');
function afficher(){let h='';lists.forEach((p,i)=>{h+=<div style="background:#05081f;padding:12px;border-radius:8px;margin-top:10px;display:flex;justify-content:space-between"><div><b>${p.nom}</b><br><small style="color:#aaa">${p.lien||p.host} ${p.pin?'🔒 PIN: '+p.pin:''}</small></div><button onclick="supp(${i})" style="background:#ff3b3b;color:white;border:none;border-radius:6px;padding:6px 10px;cursor:pointer">Supprimer</button></div>});if(!h)h='<p style="color:#888">Aucune playlist.</p>';document.getElementById('liste').innerHTML=h;}
function ajouter(){let nom,lien;if(type=='m3u'){nom=document.getElementById('nom').value;lien=document.getElementById('lien').value;}else{nom=document.getElementById('nom2').value;lien=document.getElementById('host').value+' | '+document.getElementById('user').value+' / '+document.getElementById('pass').value;}let pin=document.getElementById('pin').value;if(!nom||!lien){alert('3mer Nom w Lien');return;}lists.push({nom,lien,pin});localStorage.setItem('lists_'+mac,JSON.stringify(lists));afficher();alert('Playlist enregistrée!');}
function supp(i){lists.splice(i,1);localStorage.setItem('lists_'+mac,JSON.stringify(lists));afficher();}
afficher();
</script></body></html>
