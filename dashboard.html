<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERR PLAYER - Connexion</title>
<style>
body{margin:0;background:#0f0f2a;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#1e1e4a;padding:30px;border-radius:15px;width:90%;max-width:380px;text-align:center}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #222;background:#05081f;color:white;box-sizing:border-box;margin:8px 0;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:10px;background:#00cfff;color:white;font-weight:bold;cursor:pointer;font-size:15px}
small{color:#aaa;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h2>📺 Connectez Votre Appareil</h2>
<p style="color:#aaa;font-size:13px">Entrez l'adresse MAC et le clé affichés sur votre TV pour synchroniser vos playlists</p>
<label style="float:left;font-size:13px">Adresse MAC de l'Appareil</label>
<input id="mac" placeholder="AA:C3:C8:87:92:29" autocomplete="off">
<label style="float:left;font-size:13px">Clé de l'Appareil</label>
<input id="cle" placeholder="Ex: 536462" autocomplete="new-password" inputmode="numeric">
<button onclick="connecter()">Se Connecter & Gérer les Playlists</button>
<p><small>TERR PLAYER © 2026. Pour le renouvellement de l'abonnement, veuillez contacter le revendeur agréé.</small></p>
<p id="err" style="color:#ff4444"></p>
</div>
<script>
window.onload = function(){
  document.getElementById('mac').value = '';
  document.getElementById('cle').value = '';
};
function connecter(){
  let mac = document.getElementById('mac').value.trim().toUpperCase();
  let cle = document.getElementById('cle').value.trim();
  if(!mac || !cle){ document.getElementById('err').innerText='3mer MAC w Clé 3afak'; return; }
  localStorage.setItem('sw_mac', mac);
  localStorage.setItem('sw_cle', cle);
  window.location.href = 'dashboard.html?mac=' + encodeURIComponent(mac);
}
</script>
</body>
</html>
